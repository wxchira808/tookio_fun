{% extends "templates/web.html" %}

{% block page_content %}
<style>
	@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=VT323&display=swap');
	html, body, .page-content-wrapper, .page_content { background: #ffffff !important; }
	@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
	@keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
	@keyframes result-pop { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
	@keyframes shake {
		0%, 100% { transform: translateX(0); }
		25% { transform: translateX(-2px) rotate(-0.2deg); }
		75% { transform: translateX(2px) rotate(0.2deg); }
	}

	.page {
		min-height: 100vh;
		padding: 24px 14px 40px;
		background: #ffffff;
	}
	.topbar {
		width: min(980px, 100%);
		margin: 0 auto 14px;
		display: flex;
		justify-content: space-between;
		align-items: center;
		font-family: 'VT323', monospace;
		font-size: 16px;
	}
	.topbar a {
		text-decoration: none;
		border: 1px solid #e5e7eb;
		border-radius: 10px;
		padding: 6px 10px;
		color: #111827;
	}
	.topbar .hint { color: #6b7280; }

	.stage {
		min-height: calc(100vh - 120px);
		display: grid;
		place-items: center;
		background: radial-gradient(ellipse at 50% 40%, #1c0800 0%, #0a0400 55%, #000 100%);
		border-radius: 20px;
	}

	.machine-wrap {
		position: relative;
		width: 390px;
		max-width: calc(100vw - 56px);
	}
	.machine-wrap.shake { animation: shake 0.11s linear infinite; }

	.machine-body {
		background: linear-gradient(160deg, #8B1A1A 0%, #6b0f0f 35%, #520d0d 70%, #420b0b 100%);
		border-radius: 30px 30px 14px 14px;
		border: 3px solid #a52a2a;
		box-shadow: 0 0 0 1px #7a1a1a, 0 0 50px rgba(200, 50, 0, 0.35), inset 0 2px 0 rgba(255, 255, 255, 0.08), 0 30px 70px rgba(0, 0, 0, 0.9);
		position: relative;
	}
	.bolt {
		position: absolute;
		width: 7px;
		height: 7px;
		border-radius: 50%;
		background: radial-gradient(circle at 35% 35%, #ccc, #444);
		border: 1px solid #2a2a2a;
	}
	.topper {
		background: linear-gradient(135deg, #181818, #252525, #181818);
		border-radius: 26px 26px 0 0;
		padding: 12px 20px 10px;
		border-bottom: 3px solid #0a0a0a;
	}
	.light-row {
		display: flex;
		justify-content: center;
		gap: 6px;
	}
	.light {
		width: 8px;
		height: 8px;
		border-radius: 50%;
		border: 1px solid #222;
		transition: background 0.05s, box-shadow 0.05s;
	}
	.logo {
		text-align: center;
	}
	.logo-main {
		font-family: 'Bebas Neue', cursive;
		font-size: 44px;
		letter-spacing: 10px;
		line-height: 1;
		background: linear-gradient(90deg, #f59e0b, #fde68a, #f59e0b, #fde68a, #f59e0b);
		background-size: 200%;
		-webkit-background-clip: text;
		background-clip: text;
		-webkit-text-fill-color: transparent;
		animation: shimmer 1.8s linear infinite;
	}
	.logo-sub {
		font-family: 'VT323', monospace;
		font-size: 14px;
		color: #ef4444;
		letter-spacing: 5px;
		margin-top: -4px;
		text-shadow: 0 0 10px #ef4444;
	}
	.play {
		padding: 18px 18px 0;
	}
	.labels {
		display: flex;
		gap: 8px;
		margin-bottom: 5px;
	}
	.label {
		flex: 1;
		text-align: center;
		font-family: 'Bebas Neue', cursive;
		font-size: 11px;
		letter-spacing: 3px;
	}
	.window {
		background: #050505;
		border-radius: 14px;
		padding: 10px;
		border: 3px solid #0f0f0f;
		box-shadow: inset 0 6px 16px rgba(0, 0, 0, 0.95), 0 0 0 2px #1a1a1a;
		position: relative;
	}
	.reels {
		display: flex;
		gap: 8px;
	}
	.reel {
		flex: 1;
		height: 175px;
		border-radius: 10px;
		display: flex;
		align-items: center;
		justify-content: center;
		position: relative;
		overflow: hidden;
		border: 2px solid #2a2a2a;
		transition: box-shadow 0.4s, border-color 0.3s;
	}
	.fade-top, .fade-bottom {
		position: absolute;
		left: 0;
		right: 0;
		height: 50px;
		z-index: 3;
		pointer-events: none;
	}
	.fade-top { top: 0; background: linear-gradient(180deg, #0a0a0a, transparent); }
	.fade-bottom { bottom: 0; background: linear-gradient(0deg, #0a0a0a, transparent); }
	.scanlines {
		position: absolute;
		inset: 0;
		z-index: 4;
		pointer-events: none;
		background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0, 0, 0, 0.1) 2px, rgba(0, 0, 0, 0.1) 4px);
	}
	.payline-inner {
		position: absolute;
		top: 50%;
		left: 0;
		right: 0;
		height: 2px;
		transform: translateY(-50%);
		z-index: 2;
		pointer-events: none;
	}
	.reel-content {
		z-index: 5;
		text-align: center;
		transition: filter 0.5s ease;
	}
	.reel-icon { font-size: 52px; line-height: 1; }
	.reel-name {
		font-family: 'Bebas Neue', cursive;
		font-size: 12px;
		letter-spacing: 2px;
		color: #ccc;
		margin-top: 6px;
		transition: opacity 0.4s;
	}
	.lock-badge {
		position: absolute;
		top: 8px;
		left: 50%;
		transform: translateX(-50%);
		z-index: 6;
		font-family: 'Bebas Neue', cursive;
		font-size: 10px;
		letter-spacing: 2px;
		color: #f59e0b;
		background: #0a0800;
		padding: 2px 8px;
		border-radius: 4px;
		border: 1px solid #f59e0b80;
		text-shadow: 0 0 8px #f59e0b;
	}
	.divider {
		position: absolute;
		top: 10px;
		bottom: 10px;
		width: 5px;
		background: linear-gradient(180deg, #444, #bbb 25%, #ddd 50%, #999 75%, #333);
		border-radius: 2px;
		pointer-events: none;
	}
	.payline {
		position: absolute;
		top: 50%;
		left: -6px;
		right: -6px;
		height: 3px;
		transform: translateY(-50%);
		z-index: 10;
		pointer-events: none;
		transition: all 0.4s;
	}
	.locks {
		display: flex;
		gap: 8px;
		margin-top: 8px;
	}
	.lock-btn {
		flex: 1;
		padding: 6px 4px;
		border-radius: 7px;
		font-family: 'Bebas Neue', cursive;
		font-size: 12px;
		letter-spacing: 2px;
		display: flex;
		align-items: center;
		justify-content: center;
		gap: 4px;
		transition: all 0.2s;
		cursor: pointer;
	}
	.lock-btn:hover { transform: scale(1.06); }
	.lock-btn:active { transform: scale(0.95); }
	.display {
		margin: 10px 0;
		background: #000;
		border-radius: 8px;
		padding: 10px 12px;
		border: 2px solid #181818;
		box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.9);
		min-height: 54px;
		display: flex;
		align-items: center;
		justify-content: center;
	}
	.spinning-msg {
		font-family: 'VT323', monospace;
		font-size: 22px;
		color: #f59e0b;
		letter-spacing: 5px;
		text-shadow: 0 0 12px #f59e0b;
		animation: blink 0.4s linear infinite;
	}
	.result {
		text-align: center;
		animation: result-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
	}
	.result-tag {
		font-family: 'VT323', monospace;
		font-size: 10px;
		color: #444;
		letter-spacing: 3px;
		margin-bottom: 2px;
	}
	.result-food {
		font-family: 'Bebas Neue', cursive;
		font-size: 15px;
		letter-spacing: 1px;
		line-height: 1.4;
	}
	.pull-prompt {
		font-family: 'VT323', monospace;
		font-size: 16px;
		color: #252525;
		letter-spacing: 3px;
	}
	.panel {
		background: linear-gradient(180deg, #141414, #0f0f0f);
		border-radius: 10px;
		padding: 12px 14px;
		border: 2px solid #1a1a1a;
	}
	.panel-main { display: flex; gap: 10px; align-items: center; }
	.credits { flex: 1; }
	.credit-box {
		background: #000;
		border-radius: 6px;
		padding: 6px 10px;
		border: 1px solid #1f1f1f;
		display: flex;
		align-items: center;
		gap: 8px;
	}
	.coin {
		width: 26px;
		height: 26px;
		border-radius: 50%;
		background: radial-gradient(circle at 35% 35%, #fde68a, #d97706);
		border: 2px solid #92400e;
		display: flex;
		align-items: center;
		justify-content: center;
		font-size: 13px;
	}
	.credit-label {
		font-family: 'VT323', monospace;
		font-size: 9px;
		color: #3a3a3a;
		letter-spacing: 2px;
	}
	.credit-value {
		font-family: 'VT323', monospace;
		font-size: 24px;
		line-height: 1;
	}
	.cost {
		margin-left: auto;
		font-family: 'VT323', monospace;
		font-size: 10px;
		color: #3a3a3a;
		letter-spacing: 1px;
		text-align: right;
		line-height: 1.3;
	}
	.buy-btn {
		width: 100%;
		padding: 7px;
		background: linear-gradient(135deg, #0f2a0f, #1a3a1a);
		border: 1px solid #22c55e50;
		border-radius: 6px;
		font-family: 'Bebas Neue', cursive;
		font-size: 13px;
		letter-spacing: 2px;
		color: #22c55e;
		cursor: pointer;
		animation: blink 1s infinite;
		margin-top: 6px;
	}
	.stats {
		display: flex;
		flex-direction: column;
		gap: 6px;
		border-left: 1px solid #1f1f1f;
		padding-left: 12px;
	}
	.stat { text-align: center; }
	.stat-k {
		font-family: 'VT323', monospace;
		font-size: 9px;
		color: #3a3a3a;
		letter-spacing: 1px;
	}
	.stat-v {
		font-family: 'VT323', monospace;
		font-size: 17px;
		line-height: 1;
	}
	.tray {
		margin: 12px 18px 0;
		background: linear-gradient(180deg, #151515, #0a0a0a);
		height: 36px;
		border-radius: 0 0 6px 6px;
		border: 2px solid #080808;
		border-top: 2px solid #222;
		display: flex;
		align-items: center;
		justify-content: center;
		position: relative;
	}
	.tray-slot {
		width: 140px;
		height: 13px;
		background: #000;
		border-radius: 7px;
		border: 1px solid #2a2a2a;
		box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.9);
	}
	.tray-label {
		position: absolute;
		top: 3px;
		font-family: 'VT323', monospace;
		font-size: 8px;
		color: #252525;
		letter-spacing: 2px;
	}
	.base {
		background: linear-gradient(180deg, #3a0808, #250606);
		border-radius: 0 0 14px 14px;
		height: 22px;
		border: 3px solid #a52a2a;
		border-top: none;
		box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
	}
	.lever {
		position: absolute;
		right: -72px;
		top: 42%;
		transform: translateY(-50%);
		user-select: none;
		z-index: 10;
	}
	.lever.enabled { cursor: pointer; }
	.lever.disabled { cursor: not-allowed; }
	.lever svg {
		transition: filter 0.3s;
	}
	.lever-group {
		transform-origin: 14px 107px;
		transform: rotate(0deg);
		transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
	}
	.lever-group.pulling {
		transform: rotate(44deg);
		transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
	}
	.pull-label {
		position: absolute;
		bottom: -24px;
		left: 50%;
		transform: translateX(-50%);
		font-family: 'Bebas Neue', cursive;
		font-size: 11px;
		letter-spacing: 2px;
		color: #f59e0b;
		text-shadow: 0 0 10px #f59e0b;
		white-space: nowrap;
		animation: blink 1.4s ease-in-out infinite;
	}
	.floor-glow {
		position: absolute;
		bottom: -18px;
		left: 5%;
		right: 5%;
		height: 18px;
		background: radial-gradient(ellipse, rgba(180, 50, 0, 0.25) 0%, transparent 70%);
		filter: blur(6px);
		pointer-events: none;
	}
	@media (max-width: 740px) {
		.stage {
			padding: 22px 8px;
			border-radius: 14px;
		}
		.machine-wrap {
			max-width: calc(100vw - 30px);
		}
		.lever {
			right: -56px;
			transform: translateY(-50%) scale(0.86);
			transform-origin: center;
		}
	}
</style>

<div class="page">
	<div class="topbar">
		<a href="/">Back to Projects</a>
		<div class="hint">Crank The Lever!</div>
	</div>
	<div class="stage">
		<div class="machine-wrap" id="machine-wrap">
			<div class="machine-body">
				<div class="bolt" style="left:7px;top:14%;"></div>
				<div class="bolt" style="left:7px;top:42%;"></div>
				<div class="bolt" style="left:7px;top:68%;"></div>
				<div class="bolt" style="left:7px;top:90%;"></div>
				<div class="bolt" style="right:7px;top:14%;"></div>
				<div class="bolt" style="right:7px;top:42%;"></div>
				<div class="bolt" style="right:7px;top:68%;"></div>
				<div class="bolt" style="right:7px;top:90%;"></div>

				<div class="topper">
					<div class="light-row" id="lights-top"></div>
					<div class="logo">
						<div class="logo-main">CHAKULA</div>
						<div class="logo-sub">★ LUCKY MEAL MACHINE ★</div>
					</div>
					<div class="light-row" id="lights-bottom" style="margin-top:8px;"></div>
				</div>

				<div class="play">
					<div class="labels">
						<div class="label" style="color:#f59e0b;text-shadow:0 0 8px #f59e0b70;">CARBS</div>
						<div class="label" style="color:#ef4444;text-shadow:0 0 8px #ef444470;">STEW</div>
						<div class="label" style="color:#22c55e;text-shadow:0 0 8px #22c55e70;">GREENS</div>
					</div>

					<div class="window">
						<div class="reels">
							<div class="reel" id="reel-carbs"></div>
							<div class="reel" id="reel-protein"></div>
							<div class="reel" id="reel-vitamins"></div>
						</div>
						<div class="divider" style="left:calc(33.33% + 4px);"></div>
						<div class="divider" style="left:calc(66.66% + 0px);"></div>
						<div class="payline" id="window-payline"></div>
					</div>

					<div class="locks">
						<button class="lock-btn" data-cat="carbs"></button>
						<button class="lock-btn" data-cat="protein"></button>
						<button class="lock-btn" data-cat="vitamins"></button>
					</div>

					<div class="display" id="display"></div>

					<div class="panel">
						<div class="panel-main">
							<div class="credits">
								<div class="credit-box">
									<div class="coin">🪙</div>
									<div>
										<div class="credit-label">CREDITS</div>
										<div class="credit-value" id="coins"></div>
									</div>
									<div class="cost"><div>KES 1</div><div>= 1 SPIN</div></div>
								</div>
								<button class="buy-btn" id="buy-btn" style="display:none;">🪙 BUY 10 COINS — KES 10</button>
							</div>
							<div class="stats">
								<div class="stat"><div class="stat-k">SPINS</div><div class="stat-v" id="spins" style="color:#f59e0b;text-shadow:0 0 6px #f59e0b70;"></div></div>
								<div class="stat"><div class="stat-k">COMBOS</div><div class="stat-v" id="combos" style="color:#3b82f6;text-shadow:0 0 6px #3b82f670;"></div></div>
							</div>
						</div>
					</div>
				</div>

				<div class="tray"><div class="tray-slot"></div><div class="tray-label">COIN TRAY</div></div>
				<div class="base"></div>
			</div>

			<div class="lever enabled" id="lever" title="Pull to spin!">
				<svg width="74" height="215" viewBox="0 0 74 215" id="lever-svg">
					<rect x="0" y="92" width="22" height="30" rx="4" fill="#3a3a3a" stroke="#555" stroke-width="1" />
					<rect x="3" y="96" width="14" height="22" rx="3" fill="#1e1e1e" />
					<g class="lever-group" id="lever-group">
						<rect x="9" y="18" width="10" height="91" rx="5" fill="url(#sg)" stroke="#777" stroke-width="0.5" />
						<circle cx="14" cy="107" r="11" fill="url(#pg)" stroke="#555" stroke-width="1" />
						<circle cx="14" cy="107" r="5" fill="#111" />
						<circle cx="14" cy="20" r="17" fill="url(#hg)" stroke="#b45309" stroke-width="2" />
						<circle cx="8" cy="13" r="6" fill="rgba(255,220,80,0.3)" />
						<ellipse cx="14" cy="20" rx="17" ry="6" fill="none" stroke="#92400e" stroke-width="1" opacity="0.45" />
						<line x1="14" y1="3" x2="14" y2="37" stroke="#92400e" stroke-width="1" opacity="0.45" />
					</g>
					<defs>
						<linearGradient id="sg" x1="0" y1="0" x2="1" y2="0">
							<stop offset="0%" stop-color="#3a3a3a"/><stop offset="30%" stop-color="#c0c0c0"/><stop offset="65%" stop-color="#888"/><stop offset="100%" stop-color="#2a2a2a"/>
						</linearGradient>
						<radialGradient id="hg" cx="32%" cy="28%">
							<stop offset="0%" stop-color="#fde68a"/><stop offset="45%" stop-color="#d97706"/><stop offset="100%" stop-color="#78350f"/>
						</radialGradient>
						<radialGradient id="pg" cx="32%" cy="28%">
							<stop offset="0%" stop-color="#999"/><stop offset="100%" stop-color="#2a2a2a"/>
						</radialGradient>
					</defs>
				</svg>
				<div class="pull-label" id="pull-label">PULL</div>
			</div>

			<div class="floor-glow"></div>
		</div>
	</div>
</div>

<script>
	const FOODS = {
		carbs: [
			{ name: "Ugali", emoji: "🫓" },
			{ name: "Chapati", emoji: "🫔" },
			{ name: "Rice", emoji: "🍚" },
			{ name: "Matoke", emoji: "🍌" },
			{ name: "Mashed Potatoes", emoji: "🥔" },
			{ name: "Chips", emoji: "🍟" },
			{ name: "Githeri", emoji: "🫘" },
			{ name: "Mukimo", emoji: "🟤" },
		],
		protein: [
			{ name: "Beef Stew", emoji: "🥘" },
			{ name: "Goat Stew", emoji: "🐐" },
			{ name: "Beans", emoji: "🫘" },
			{ name: "Minji", emoji: "🫛" },
			{ name: "Ndengu", emoji: "🟢" },
			{ name: "Nyama Choma", emoji: "🥩" },
			{ name: "Chicken Stew", emoji: "🍗" },
			{ name: "Omena", emoji: "🐠" },
			{ name: "Fish Stew", emoji: "🐟" },
		],
		vitamins: [
			{ name: "Sukuma Wiki", emoji: "🥬" },
			{ name: "Cabbage", emoji: "🥦" },
			{ name: "Terere", emoji: "🌱" },
			{ name: "Spinach", emoji: "🥬" },
			{ name: "Kachumbari", emoji: "🍅" },
			{ name: "Kunde", emoji: "🌿" },
			{ name: "Carrots", emoji: "🥕" },
		],
	};

	const CAT_COLOR = { carbs: "#f59e0b", protein: "#ef4444", vitamins: "#22c55e" };
	const TOTAL_COMBOS = FOODS.carbs.length * FOODS.protein.length * FOODS.vitamins.length;
	const LIGHT_COLORS = ["#f59e0b", "#ef4444", "#22c55e", "#3b82f6", "#a855f7", "#ec4899", "#14b8a6", "#f97316", "#fbbf24", "#34d399", "#60a5fa", "#f472b6", "#e879f9", "#a3e635"];

	const state = {
		spinning: false,
		pulling: false,
		coins: 10,
		spinCount: 0,
		lights: 0,
		locked: { carbs: false, protein: false, vitamins: false },
		displayIndex: { carbs: 0, protein: 0, vitamins: 0 },
		finalIndex: { carbs: 0, protein: 0, vitamins: 0 },
		result: null,
		reelIntervals: { carbs: null, protein: null, vitamins: null },
		timeouts: [],
		lightsTimer: null,
	};

	const refs = {
		reels: {
			carbs: document.getElementById("reel-carbs"),
			protein: document.getElementById("reel-protein"),
			vitamins: document.getElementById("reel-vitamins"),
		},
		locks: Array.from(document.querySelectorAll(".lock-btn")),
		display: document.getElementById("display"),
		coins: document.getElementById("coins"),
		spins: document.getElementById("spins"),
		combos: document.getElementById("combos"),
		buyBtn: document.getElementById("buy-btn"),
		wrap: document.getElementById("machine-wrap"),
		lever: document.getElementById("lever"),
		leverSvg: document.getElementById("lever-svg"),
		leverGroup: document.getElementById("lever-group"),
		pullLabel: document.getElementById("pull-label"),
		lightsTop: document.getElementById("lights-top"),
		lightsBottom: document.getElementById("lights-bottom"),
		windowPayline: document.getElementById("window-payline"),
	};

	refs.combos.textContent = TOTAL_COMBOS.toLocaleString();

	function clearAllTimeouts() {
		while (state.timeouts.length) {
			clearTimeout(state.timeouts.pop());
		}
	}

	function queueTimeout(fn, ms) {
		const id = setTimeout(fn, ms);
		state.timeouts.push(id);
		return id;
	}

	function reelItem(cat, idx) {
		const arr = FOODS[cat];
		return arr[((idx % arr.length) + arr.length) % arr.length];
	}

	function randomIndex(cat) {
		return Math.floor(Math.random() * FOODS[cat].length);
	}

	function drawReel(cat) {
		const reel = refs.reels[cat];
		const item = reelItem(cat, state.displayIndex[cat]);
		const locked = state.locked[cat];
		const isSpinning = state.spinning && !locked;
		const color = CAT_COLOR[cat];
		reel.style.background = locked
			? "linear-gradient(180deg,#0a0a0a 0%,#1a1200 50%,#0a0a0a 100%)"
			: "linear-gradient(180deg,#0a0a0a 0%,#1a1a1a 50%,#0a0a0a 100%)";
		reel.style.borderColor = locked ? "#f59e0b" : color;
		reel.style.boxShadow = locked
			? "0 0 20px #f59e0b80, inset 0 0 20px #f59e0b15"
			: isSpinning
				? `0 0 28px ${color}90, inset 0 0 20px ${color}20`
				: `0 0 8px ${color}40`;

		reel.innerHTML = `
			<div class="fade-top"></div>
			<div class="fade-bottom"></div>
			<div class="scanlines"></div>
			<div class="payline-inner" style="background:${locked ? "#f59e0b60" : `${color}40`}"></div>
			${locked ? '<div class="lock-badge">🔒 LOCKED</div>' : ""}
			<div class="reel-content" style="filter:${isSpinning ? "blur(3px) brightness(1.4)" : "blur(0px) brightness(1)"}">
				<div class="reel-icon">${item.emoji}</div>
				<div class="reel-name" style="opacity:${isSpinning ? "0" : "1"}">${item.name}</div>
			</div>
		`;
	}

	function drawLockButtons() {
		refs.locks.forEach((btn) => {
			const cat = btn.dataset.cat;
			const locked = state.locked[cat];
			btn.disabled = state.spinning;
			btn.style.background = locked
				? "linear-gradient(135deg,#3a2a00,#2a1e00)"
				: "linear-gradient(135deg,#1a1a1a,#111)";
			btn.style.border = locked ? "1px solid #f59e0b90" : "1px solid #2a2a2a";
			btn.style.color = locked ? "#f59e0b" : "#444";
			btn.style.cursor = state.spinning ? "not-allowed" : "pointer";
			btn.style.boxShadow = locked ? "0 0 10px #f59e0b40" : "none";
			btn.innerHTML = `<span>${locked ? "🔒" : "🔓"}</span><span>${locked ? "LOCKED" : "LOCK"}</span>`;
		});
	}

	function drawDisplay() {
		if (state.spinning) {
			refs.display.innerHTML = '<div class="spinning-msg">*** SPINNING ***</div>';
			return;
		}
		if (state.result) {
			refs.display.innerHTML = `
				<div class="result">
					<div class="result-tag">TODAY\'S PLATE:</div>
					<div class="result-food">
						<span style="color:${CAT_COLOR.carbs}">${state.result.carbs.emoji} ${state.result.carbs.name}</span>
						<span style="color:#333"> + </span>
						<span style="color:${CAT_COLOR.protein}">${state.result.protein.emoji} ${state.result.protein.name}</span>
						<span style="color:#333"> + </span>
						<span style="color:${CAT_COLOR.vitamins}">${state.result.vitamins.emoji} ${state.result.vitamins.name}</span>
					</div>
				</div>
			`;
			return;
		}
		refs.display.innerHTML = '<div class="pull-prompt">PULL THE LEVER →</div>';
	}

	function drawStats() {
		refs.coins.textContent = String(state.coins).padStart(2, "0");
		refs.coins.style.color = state.coins > 3 ? "#22c55e" : "#ef4444";
		refs.coins.style.textShadow = `0 0 8px ${state.coins > 3 ? "#22c55e" : "#ef4444"}`;
		refs.spins.textContent = String(state.spinCount).padStart(3, "0");
		refs.buyBtn.style.display = state.coins === 0 ? "block" : "none";
	}

	function drawLever() {
		const disabled = state.spinning || state.coins === 0 || Object.values(state.locked).every(Boolean);
		refs.lever.classList.toggle("enabled", !disabled);
		refs.lever.classList.toggle("disabled", disabled);
		refs.leverSvg.style.filter = disabled
			? "brightness(0.35) saturate(0)"
			: "drop-shadow(2px 5px 10px rgba(0,0,0,0.8))";
		refs.pullLabel.style.display = disabled ? "none" : "block";
		refs.wrap.classList.toggle("shake", state.spinning);
		refs.leverGroup.classList.toggle("pulling", state.pulling);
		refs.windowPayline.style.background = state.spinning
			? "linear-gradient(90deg,transparent,#f59e0b,#ef4444,#22c55e,transparent)"
			: "linear-gradient(90deg,transparent,#f59e0b40,transparent)";
		refs.windowPayline.style.boxShadow = state.spinning ? "0 0 16px #f59e0b" : "none";
	}

	function drawAll() {
		drawReel("carbs");
		drawReel("protein");
		drawReel("vitamins");
		drawLockButtons();
		drawDisplay();
		drawStats();
		drawLever();
	}

	function startLights() {
		if (state.lightsTimer) clearInterval(state.lightsTimer);
		state.lightsTimer = setInterval(() => {
			state.lights = (state.lights + 1) % 14;
			renderLights();
		}, state.spinning ? 55 : 320);
	}

	function renderLights() {
		const mk = (offset) => Array.from({ length: 20 }).map((_, i) => {
			const on = ((i + state.lights + offset) % 2) === 0;
			const c = LIGHT_COLORS[(i + (offset ? 6 : 0)) % LIGHT_COLORS.length];
			return `<div class="light" style="background:${on ? c : "#111"};box-shadow:${on ? `0 0 7px ${c}` : "none"};"></div>`;
		}).join("");
		refs.lightsTop.innerHTML = mk(0);
		refs.lightsBottom.innerHTML = mk(1);
	}

	function spinReel(cat) {
		if (state.locked[cat]) return;
		if (state.reelIntervals[cat]) clearInterval(state.reelIntervals[cat]);
		state.reelIntervals[cat] = setInterval(() => {
			state.displayIndex[cat] = (state.displayIndex[cat] + 1) % FOODS[cat].length;
			drawReel(cat);
		}, 72);
	}

	function stopReel(cat, finalIdx) {
		if (state.locked[cat]) return;
		if (state.reelIntervals[cat]) {
			clearInterval(state.reelIntervals[cat]);
			state.reelIntervals[cat] = null;
		}
		const slowSteps = [110, 170, 250, 360, 480, 580];
		let step = 0;
		const tick = () => {
			state.displayIndex[cat] = (state.displayIndex[cat] + 1) % FOODS[cat].length;
			drawReel(cat);
			step += 1;
			if (step < slowSteps.length) {
				queueTimeout(tick, slowSteps[step]);
			} else {
				state.displayIndex[cat] = finalIdx;
				drawReel(cat);
			}
		};
		queueTimeout(tick, slowSteps[0]);
	}

	function setPulling(value) {
		state.pulling = value;
		drawLever();
	}

	function handleToggleLock(cat) {
		if (state.spinning) return;
		state.locked[cat] = !state.locked[cat];
		drawAll();
	}

	function setSpinning(value) {
		state.spinning = value;
		startLights();
		drawAll();
	}

	function pullAndSpin() {
		if (state.spinning || state.coins <= 0) return;
		if (Object.values(state.locked).every(Boolean)) return;

		setPulling(true);
		queueTimeout(() => setPulling(false), 700);

		queueTimeout(() => {
			setSpinning(true);
			state.result = null;
			state.coins -= 1;
			state.spinCount += 1;
			drawStats();
			drawDisplay();

			state.finalIndex = {
				carbs: state.locked.carbs ? state.finalIndex.carbs : randomIndex("carbs"),
				protein: state.locked.protein ? state.finalIndex.protein : randomIndex("protein"),
				vitamins: state.locked.vitamins ? state.finalIndex.vitamins : randomIndex("vitamins"),
			};

			spinReel("carbs");
			spinReel("protein");
			spinReel("vitamins");

			queueTimeout(() => {
				setSpinning(false);
				stopReel("carbs", state.finalIndex.carbs);
				stopReel("protein", state.finalIndex.protein);
				stopReel("vitamins", state.finalIndex.vitamins);

				queueTimeout(() => {
					state.result = {
						carbs: reelItem("carbs", state.finalIndex.carbs),
						protein: reelItem("protein", state.finalIndex.protein),
						vitamins: reelItem("vitamins", state.finalIndex.vitamins),
					};
					drawDisplay();
				}, 1700);
			}, 2500);
		}, 260);
	}

	refs.locks.forEach((btn) => {
		btn.addEventListener("click", () => handleToggleLock(btn.dataset.cat));
	});
	refs.lever.addEventListener("click", pullAndSpin);
	refs.buyBtn.addEventListener("click", () => {
		state.coins = 10;
		drawAll();
	});

	renderLights();
	startLights();
	drawAll();
</script>
{% endblock %}
